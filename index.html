<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Lyrics Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#111318;--fg:#f3efe8;--dim:rgba(243,239,232,.3);--line:rgba(243,239,232,.14)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:-12%;background:center/cover;filter:blur(64px) saturate(1.35) brightness(.42)}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
#art{width:52px;height:52px;border-radius:6px;object-fit:cover;background:#222}
#title{font-weight:800;font-size:18px;line-height:1.15}
#artist{font-weight:500;font-size:14px;opacity:.6}
#lyrics{flex:1;overflow-y:auto;scrollbar-width:none;padding:38vh 22px;max-width:900px;width:100%;margin:0 auto}
#lyrics::-webkit-scrollbar{display:none}
.l{font-size:clamp(26px,5.4vw,46px);font-weight:700;line-height:1.18;margin:0 0 .6em;color:var(--dim);transition:color .35s,transform .35s;transform-origin:left center;overflow-wrap:anywhere}
.l.on{color:var(--fg);transform:scale(1.04)}
.msg{font-size:20px;font-weight:500;opacity:.7}
footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 16px;border-top:1px solid var(--line)}
button{font:inherit;font-weight:700;font-size:14px;color:var(--fg);background:rgba(243,239,232,.1);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer}
button:active{background:rgba(243,239,232,.22)}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#setup{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;padding:28px 22px;z-index:5}
#setup>div{max-width:520px;margin:0 auto}
#setup h1{font-size:34px;margin:0 0 6px;font-weight:800}
#setup p,#setup li{line-height:1.5;opacity:.85}
code{background:rgba(243,239,232,.1);padding:2px 6px;border-radius:4px;word-break:break-all;user-select:all}
input{width:100%;font:inherit;padding:12px 14px;margin:14px 0;border-radius:8px;border:1px solid var(--line);background:rgba(243,239,232,.06);color:var(--fg)}
@media (prefers-reduced-motion:reduce){.l{transition:none}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header><img id="art" alt=""><div><div id="title">Lyrics Deck</div><div id="artist">Waiting for playback</div></div></header>
  <main id="lyrics"><p class="msg">Play a song on Spotify from any device.</p></main>
  <footer>
    <button id="prev">Previous</button><button id="pp">Play / Pause</button><button id="next">Next</button>
    <button id="sm">Lyrics earlier</button><button id="sp">Lyrics later</button><button id="fs">Fullscreen</button>
  </footer>
</div>

<div id="setup"><div>
  <h1>Lyrics Deck</h1>
  <p>One-time setup:</p>
  <ol>
    <li>Open the Spotify Developer Dashboard and create an app that uses the Web API.</li>
    <li>Add this as a Redirect URI: <code id="ru"></code></li>
    <li>Paste the app’s Client ID below.</li>
  </ol>
  <input id="cid" placeholder="Client ID" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="go">Connect Spotify</button>
</div></div>

<script>
const $ = s => document.querySelector(s);
const LS = localStorage;
const REDIRECT = location.origin + location.pathname;
const SCOPE = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';
let tok = null;
try { tok = JSON.parse(LS.getItem('tok') || 'null'); } catch (e) {}

let cur = null, base = 0, at = 0, playing = false, lines = [], synced = false, idx = -1, off = 0;

const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function login() {
  const id = $('#cid').value.trim();
  if (!id) return;
  LS.setItem('cid', id);
  const v = b64(crypto.getRandomValues(new Uint8Array(48)));
  LS.setItem('ver', v);
  const ch = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  location = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: id, response_type: 'code', redirect_uri: REDIRECT, scope: SCOPE,
    code_challenge_method: 'S256', code_challenge: ch
  });
}

async function token(body) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: LS.getItem('cid'), ...body })
  });
  if (!r.ok) throw 0;
  const j = await r.json();
  tok = { a: j.access_token, r: j.refresh_token || (tok && tok.r), e: Date.now() + j.expires_in * 1000 - 30000 };
  LS.setItem('tok', JSON.stringify(tok));
}

async function api(path, opt = {}) {
  if (Date.now() > tok.e) await token({ grant_type: 'refresh_token', refresh_token: tok.r });
  const r = await fetch('https://api.spotify.com/v1/me/player' + path, { ...opt, headers: { Authorization: 'Bearer ' + tok.a } });
  return r.status === 200 ? r.json() : null;
}

function msg(t) {
  const p = document.createElement('p');
  p.className = 'msg'; p.textContent = t;
  $('#lyrics').replaceChildren(p);
}

function parse(s) {
  return s.split('\n').map(l => {
    const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    return m ? { t: (+m[1] * 60 + +m[2]) * 1000, s: m[3] || '♪' } : null;
  }).filter(Boolean);
}

function draw(arr, isSynced) {
  lines = arr; synced = isSynced; idx = -1;
  $('#lyrics').replaceChildren(...arr.map(x => {
    const p = document.createElement('p');
    p.className = 'l'; p.textContent = x.s;
    if (!isSynced) p.style.color = 'var(--fg)';
    return p;
  }));
  $('#lyrics').scrollTop = 0;
}

async function setTrack(t) {
  const names = t.artists.map(a => a.name).join(', ');
  const img = t.album.images[0] && t.album.images[0].url;
  $('#title').textContent = t.name;
  $('#artist').textContent = names;
  if (img) { $('#art').src = img; $('#bg').style.backgroundImage = 'url(' + img + ')'; }
  off = 0; synced = false; msg('Finding lyrics…');
  const q = { track_name: t.name, artist_name: t.artists[0].name };
  let j = null;
  try {
    let r = await fetch('https://lrclib.net/api/get?' + new URLSearchParams({ ...q, album_name: t.album.name, duration: Math.round(t.duration_ms / 1000) }));
    if (r.ok) j = await r.json();
    else {
      r = await fetch('https://lrclib.net/api/search?' + new URLSearchParams(q));
      const a = r.ok ? await r.json() : [];
      j = a.find(x => x.syncedLyrics) || a[0] || null;
    }
  } catch (e) {}
  if (cur !== t.id) return;
  if (j && j.syncedLyrics) draw(parse(j.syncedLyrics), true);
  else if (j && j.plainLyrics) draw(j.plainLyrics.split('\n').map(s => ({ t: 0, s: s || ' ' })), false);
  else msg('No lyrics found for this track.');
}

async function poll() {
  try {
    const d = await api('/currently-playing');
    if (!d || !d.item || !d.item.artists) { return; }
    base = d.progress_ms; at = performance.now(); playing = d.is_playing;
    if (d.item.id !== cur) { cur = d.item.id; setTrack(d.item); }
  } catch (e) {
    if (e === 0) { LS.removeItem('tok'); location.reload(); }
  }
}

setInterval(() => {
  if (!synced || !lines.length) return;
  const p = base + (playing ? performance.now() - at : 0) + off;
  let i = -1;
  for (let k = 0; k < lines.length; k++) { if (lines[k].t <= p) i = k; else break; }
  if (i === idx) return;
  const els = $('#lyrics').children;
  if (els[idx]) els[idx].classList.remove('on');
  idx = i;
  if (els[i]) { els[i].classList.add('on'); els[i].scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}, 150);

async function ctl(path, method) {
  try { await api(path, { method }); } catch (e) {}
  setTimeout(poll, 500);
}

async function wake() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
}

function start() {
  poll(); setInterval(poll, 4000);
  $('#prev').onclick = () => ctl('/previous', 'POST');
  $('#next').onclick = () => ctl('/next', 'POST');
  $('#pp').onclick = () => ctl(playing ? '/pause' : '/play', 'PUT');
  $('#sm').onclick = () => { off += 500; };
  $('#sp').onclick = () => { off -= 500; };
  $('#fs').onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  document.addEventListener('click', wake, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
}

async function boot() {
  $('#ru').textContent = REDIRECT;
  $('#go').onclick = login;
  const code = new URLSearchParams(location.search).get('code');
  if (code) {
    try { await token({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: LS.getItem('ver') }); } catch (e) {}
    history.replaceState({}, '', REDIRECT);
  }
  if (!tok) { $('#cid').value = LS.getItem('cid') || ''; $('#setup').style.display = 'block'; return; }
  start();
}
boot();
</script>
</body>
</html>
