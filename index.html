<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Lyrics Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#111318;--fg:#fff;--line:rgba(255,255,255,.14);--gp:48px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;overflow:hidden;background:#1b1d24}
#bg .bl{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
#bg .bl.in{opacity:1}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.06)}
#app{position:relative;height:100%;display:flex;align-items:center;gap:5vw;padding:max(24px,env(safe-area-inset-top)) max(5vw,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(5vw,env(safe-area-inset-left))}
#left{flex:0 0 min(34vw,64vh);display:flex;flex-direction:column;gap:14px}

/* album art + tap-to-toggle controls */
#artwrap{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:0 18px 50px rgba(0,0,0,.45);container-type:inline-size;cursor:pointer}
#art{display:block;width:100%;height:100%;object-fit:cover}
#ctrls{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5cqw;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
#artwrap.show #ctrls{opacity:1;pointer-events:auto}
.cb{width:15cqw;height:15cqw;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;transition:transform .12s,background .12s}
.cb:active{transform:scale(.9);background:rgba(255,255,255,.3)}
.cb svg{width:48%;height:48%;fill:#fff}
.cb.big{width:21cqw;height:21cqw;background:rgba(255,255,255,.92)}
.cb.big svg{fill:#111318;width:46%;height:46%}
.cb.big:active{background:#fff}

#title{font-weight:800;font-size:clamp(18px,2.2vw,26px);line-height:1.15}
#sub{font-weight:500;font-size:clamp(13px,1.5vw,17px);opacity:.65;margin-top:3px}
#bar{height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
#fill{height:100%;width:100%;background:#fff;border-radius:2px;transform:scaleX(0);transform-origin:left}
#times{display:flex;justify-content:space-between;font-size:12px;opacity:.6;font-variant-numeric:tabular-nums;margin-top:-6px}

/* synced lyrics move with a GPU transform (no layout, no scroll repaint); plain lyrics use normal scroll */
#lyrics{flex:1;height:100%;overflow:hidden;padding:0 var(--gp);margin:0 calc(var(--gp)*-1);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#lyrics.scroll{overflow-y:auto;scrollbar-width:none}
#lyrics::-webkit-scrollbar{display:none}
#track{position:relative;transition:transform .7s cubic-bezier(.22,.8,.2,1);will-change:transform}
#lyrics.scroll #track{padding:42vh 0;transform:none!important;transition:none;will-change:auto}
.l{position:relative;font-size:clamp(24px,3.7vw,46px);font-weight:800;line-height:1.2;margin:0 0 .26em;padding:.12em 0;color:#fff;opacity:.3;transition:opacity .45s;overflow-wrap:anywhere}
/* glow lives on a pseudo-element and only its opacity animates (cheap, no repaint) */
.l::after{content:attr(data-t);position:absolute;left:0;right:0;top:.12em;color:transparent;pointer-events:none;opacity:0;transition:opacity .45s;text-shadow:0 0 10px rgba(255,255,255,.35),0 0 26px rgba(255,255,255,.25),0 0 56px rgba(255,255,255,.12)}
.l.on::after{opacity:1}
.msg{font-size:22px;font-weight:500;opacity:.7}
#setup{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;padding:28px 22px;z-index:5}
#setup>div{max-width:520px;margin:0 auto}
#setup h1{font-size:34px;margin:0 0 6px;font-weight:800}
#setup p,#setup li{line-height:1.5;opacity:.85}
code{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:4px;word-break:break-all;user-select:all}
input{width:100%;font:inherit;padding:12px 14px;margin:14px 0;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff}
button{font:inherit;font-weight:700;font-size:15px;color:#fff;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:999px;padding:11px 20px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (max-aspect-ratio:1/1){
#app{flex-direction:column;gap:12px;align-items:stretch;padding-top:max(16px,env(safe-area-inset-top))}
#left{flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px}
#artwrap{width:min(22vh,34vw)}
#meta{flex:1;min-width:0}
#bar,#times{flex:0 0 100%}
#lyrics.scroll #track{padding:30vh 0}
.l{font-size:clamp(24px,7vw,38px)}
}
@media (prefers-reduced-motion:reduce){.l,#ctrls{transition:none}}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div id="app">
<section id="left">
<div id="artwrap">
<img id="art" alt="">
<div id="ctrls">
<button class="cb" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
<button class="cb big" id="pp" aria-label="Play / pause"></button>
<button class="cb" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
</div>
</div>
<div id="meta"><div id="title">Lyrics Deck</div><div id="sub">Waiting for playback</div></div>
<div id="bar"><div id="fill"></div></div>
<div id="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
</section>
<main id="lyrics" class="scroll"><div id="track"><p class="msg">Play a song on Spotify from any device.</p></div></main>
</div>
<div id="setup"><div>
<h1>Lyrics Deck</h1>
<p>One-time setup:</p>
<ol>
<li>Open the Spotify Developer Dashboard and create an app that uses the Web API.</li>
<li>Add this as a Redirect URI: <code id="ru"></code></li>
<li>Paste the app’s Client ID below.</li>
</ol>
<input id="cid" placeholder="Client ID" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="go">Connect Spotify</button>
</div></div>
<script>
const $ = s => document.querySelector(s);
const LS = localStorage;
const REDIRECT = location.origin + location.pathname;
const SCOPE = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';
const SCOPE_V = '2'; // bump when SCOPE changes, forces one re-login
let tok = null;
try { tok = JSON.parse(LS.getItem('tok') || 'null'); } catch (e) {}
if (LS.getItem('scv') !== SCOPE_V) tok = null; // old token lacks playback-control permission
let cur = null, base = 0, at = 0, playing = false, dur = 1, lines = [], synced = false, idx = -1;

const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
function icon() { $('#pp').innerHTML = playing ? ICON_PAUSE : ICON_PLAY; }
icon();

const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const pos = () => base + (playing ? performance.now() - at : 0);

async function login() {
const id = $('#cid').value.trim();
if (!id) return;
LS.setItem('cid', id);
const v = b64(crypto.getRandomValues(new Uint8Array(48)));
LS.setItem('ver', v);
const ch = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
location = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
client_id: id, response_type: 'code', redirect_uri: REDIRECT, scope: SCOPE,
code_challenge_method: 'S256', code_challenge: ch
});
}

async function token(body) {
const r = await fetch('https://accounts.spotify.com/api/token', {
method: 'POST',
headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
body: new URLSearchParams({ client_id: LS.getItem('cid'), ...body })
});
if (!r.ok) throw 0;
const j = await r.json();
tok = { a: j.access_token, r: j.refresh_token || (tok && tok.r), e: Date.now() + j.expires_in * 1000 - 30000 };
LS.setItem('tok', JSON.stringify(tok));
}

// GET returns parsed JSON (or null); other methods return the HTTP status
async function api(path, method = 'GET') {
if (Date.now() > tok.e) await token({ grant_type: 'refresh_token', refresh_token: tok.r });
const r = await fetch('https://api.spotify.com/v1/me/player' + path, { method, headers: { Authorization: 'Bearer ' + tok.a } });
if (method !== 'GET') return r.status;
return r.status === 200 ? r.json() : null;
}

function msg(t) {
const p = document.createElement('p');
p.className = 'msg'; p.textContent = t;
$('#lyrics').classList.add('scroll');
$('#track').replaceChildren(p);
lines = []; synced = false;
}

function parse(s) {
return s.split('\n').map(l => {
const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
return m ? { t: (+m[1] * 60 + +m[2]) * 1000, s: m[3] || '♪' } : null;
}).filter(Boolean);
}

function center() { return $('#lyrics').clientHeight * .4; }
function draw(arr, isSynced) {
lines = arr; synced = isSynced; idx = -1;
$('#lyrics').classList.toggle('scroll', !isSynced);
$('#track').replaceChildren(...arr.map(x => {
const p = document.createElement('p');
p.className = 'l'; p.textContent = x.s; p.dataset.t = x.s;
p.style.opacity = isSynced ? '' : 1;
return p;
}));
$('#lyrics').scrollTop = 0;
$('#track').style.transform = 'translate3d(0,' + center() + 'px,0)';
}

// background: dominant colour from the cover as a solid base + a second hue glowing from the top-right
let bgTok = 0;
function hsl(r, g, b) {
r /= 255; g /= 255; b /= 255;
const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
let h = 0, sat = 0;
if (d) {
sat = d / (1 - Math.abs(2 * l - 1));
h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
h = (h * 60 + 360) % 360;
}
return [h, sat, l];
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function palette(im) {
const c = document.createElement('canvas'); c.width = c.height = 16;
const x = c.getContext('2d', { willReadFrequently: true });
x.drawImage(im, 0, 0, 16, 16);
const px = x.getImageData(0, 0, 16, 16).data, bins = {};
for (let i = 0; i < px.length; i += 4) {
const [h, sat, l] = hsl(px[i], px[i + 1], px[i + 2]);
if (l < .06 || l > .94) continue;
const w = (sat * .8 + .15) * (1 - Math.abs(l - .45));
const k = sat < .12 ? 'g' : Math.floor(h / 30);
const o = bins[k] || (bins[k] = { w: 0, x: 0, y: 0, s: 0, l: 0 });
const rad = h * Math.PI / 180;
o.w += w; o.x += Math.cos(rad) * w; o.y += Math.sin(rad) * w; o.s += sat * w; o.l += l * w;
}
const list = Object.values(bins).filter(o => o.w > 0).map(o => ({ w: o.w, h: (Math.atan2(o.y, o.x) * 180 / Math.PI + 360) % 360, s: o.s / o.w, l: o.l / o.w })).sort((a, b) => b.w - a.w);
if (!list.length) return null;
const A = list[0];
const dist = (a, b) => { const d = Math.abs(a - b) % 360; return Math.min(d, 360 - d); };
const B = list.find(o => dist(o.h, A.h) >= 40 && o.s > .15) || { h: (A.h + 35) % 360, s: A.s, l: A.l };
return { A, B };
}
function paint(css) {
const el = document.createElement('div');
el.className = 'bl'; el.style.background = css;
const box = $('#bg');
box.appendChild(el);
requestAnimationFrame(() => requestAnimationFrame(() => {
el.classList.add('in');
setTimeout(() => { while (box.children.length > 1) box.removeChild(box.firstChild); }, 1100);
}));
}
function bg(url) {
const my = ++bgTok;
const fallback = () => { if (my === bgTok) paint('radial-gradient(60% 70% at 88% 6%,#3a4466 0%,transparent 70%),#1b1d24'); };
const im = new Image();
im.crossOrigin = 'anonymous';
im.onload = () => {
if (my !== bgTok) return;
let P = null;
try { P = palette(im); } catch (e) {}
if (!P) return fallback();
const { A, B } = P;
const base = 'hsl(' + A.h.toFixed(0) + ',' + (clamp(A.s, .35, .85) * 100).toFixed(0) + '%,' + (clamp(A.l * .7, .14, .3) * 100).toFixed(0) + '%)';
const glow = 'hsl(' + B.h.toFixed(0) + ',' + (clamp(B.s, .4, .9) * 100).toFixed(0) + '%,' + (clamp(B.l, .3, .48) * 100).toFixed(0) + '%)';
const deep = 'hsl(' + A.h.toFixed(0) + ',' + (clamp(A.s, .3, .8) * 100).toFixed(0) + '%,9%)';
paint('radial-gradient(60% 70% at 88% 6%,' + glow + ' 0%,transparent 70%),radial-gradient(70% 60% at 6% 100%,' + deep + ' 0%,transparent 70%),' + base);
};
im.onerror = fallback;
im.src = url;
}

async function setTrack(t) {
const img = t.album.images[0] && t.album.images[0].url;
$('#title').textContent = t.name;
$('#sub').textContent = (t.album.release_date || '').slice(0, 4) + ' · ' + t.artists.map(a => a.name).join(', ');
if (img) { $('#art').src = img; bg(t.album.images[t.album.images.length - 1].url); }
msg('Finding lyrics…');
const q = { track_name: t.name, artist_name: t.artists[0].name };
let j = null;
try {
let r = await fetch('https://lrclib.net/api/get?' + new URLSearchParams({ ...q, album_name: t.album.name, duration: Math.round(t.duration_ms / 1000) }));
if (r.ok) j = await r.json();
else {
r = await fetch('https://lrclib.net/api/search?' + new URLSearchParams(q));
const a = r.ok ? await r.json() : [];
j = a.find(x => x.syncedLyrics) || a[0] || null;
}
} catch (e) {}
if (cur !== t.id) return;
if (j && j.syncedLyrics) draw(parse(j.syncedLyrics), true);
else if (j && j.plainLyrics) draw(j.plainLyrics.split('\n').map(s => ({ t: 0, s: s || ' ' })), false);
else msg('No lyrics found for this track.');
}

async function poll() {
try {
const d = await api('/currently-playing');
if (!d || !d.item || !d.item.artists) return;
base = d.progress_ms; at = performance.now(); playing = d.is_playing; dur = d.item.duration_ms;
icon();
$('#td').textContent = fmt(dur);
if (d.item.id !== cur) { cur = d.item.id; setTrack(d.item); }
} catch (e) {
if (e === 0) { LS.removeItem('tok'); location.reload(); }
}
}

// playback controls (needs Spotify Premium)
async function ctl(act) {
try {
if (act === 'pp') {
base = pos(); at = performance.now(); playing = !playing; icon(); // instant feedback
await api(playing ? '/play' : '/pause', 'PUT');
} else {
await api(act === 'next' ? '/next' : '/previous', 'POST');
}
} catch (e) {}
setTimeout(poll, 500);
setTimeout(poll, 1500);
}

let lastSec = -1;
const OP = [1, .55, .38, .28];
function tick() {
const p = pos();
$('#fill').style.transform = 'scaleX(' + Math.min(1, p / dur) + ')';
const sec = Math.floor(p / 1000);
if (sec !== lastSec) { lastSec = sec; $('#tc').textContent = fmt(p); }
if (!synced || !lines.length) return;
let i = -1;
for (let k = 0; k < lines.length; k++) { if (lines[k].t <= p) i = k; else break; }
if (i === idx) return;
idx = i;
const els = $('#track').children;
for (let k = 0; k < els.length; k++) {
const d = Math.abs(k - i);
els[k].classList.toggle('on', d === 0);
els[k].style.opacity = i < 0 ? OP[2] : OP[Math.min(d, 3)];
}
const y = i < 0 ? center() : $('#lyrics').clientHeight / 2 - (els[i].offsetTop + els[i].offsetHeight / 2);
$('#track').style.transform = 'translate3d(0,' + y + 'px,0)';
}

async function wake() {
try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
}

function start() {
poll(); setInterval(poll, 4000); setInterval(tick, 200);
window.addEventListener('resize', () => { idx = -2; });
// tap album art: show controls, tap again: hide
$('#artwrap').addEventListener('click', () => $('#artwrap').classList.toggle('show'));
[['#prev', 'prev'], ['#pp', 'pp'], ['#next', 'next']].forEach(([s, a]) =>
$(s).addEventListener('click', e => { e.stopPropagation(); ctl(a); }));
document.addEventListener('click', () => {
wake();
if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
}

async function boot() {
$('#ru').textContent = REDIRECT;
$('#go').onclick = login;
const code = new URLSearchParams(location.search).get('code');
if (code) {
try {
await token({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: LS.getItem('ver') });
LS.setItem('scv', SCOPE_V);
} catch (e) {}
history.replaceState({}, '', REDIRECT);
}
if (!tok) { $('#cid').value = LS.getItem('cid') || ''; $('#setup').style.display = 'block'; return; }
start();
}
boot();
</script>
</body>
</html>
